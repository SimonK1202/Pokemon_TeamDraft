# Hand-made corrections, applied by the importer on top of the raw PokeAPI data.
# Only for values where PokeAPI (commit in pokeapi_source.toml) differs from the games themselves.
# Checked 2026-11-12 against the game disassemblies pret/pokered, pret/pokecrystal and pret/pokefirered:
# Gen 1 base stats, types, type chart and learnsets match exactly; Gen 2 type chart matches;
# the moves below differ because a later change is missing in PokeAPI's move_changelog.csv.

[[move]]
identifier = "rest"
generations = [1, 2, 3]
pp = 10
reason = "PP was 10 before Gen 9; change missing in move_changelog"

[[move]]
identifier = "soft-boiled"
generations = [1, 2, 3]
pp = 10
reason = "PP was 10 before Gen 9; change missing in move_changelog"

[[move]]
identifier = "milk-drink"
generations = [2, 3]
pp = 10
reason = "PP was 10 before Gen 9; change missing in move_changelog"

[[move]]
identifier = "slack-off"
generations = [3]
pp = 10
reason = "PP was 10 before Gen 9; change missing in move_changelog"

[[move]]
identifier = "mind-reader"
generations = [2, 3]
pp = 5
reason = "PP was 5 in the games in scope; change missing in move_changelog"

[[move]]
identifier = "luster-purge"
generations = [3]
power = 70
reason = "Power was 70 before Gen 7; change missing in move_changelog"

# Friendship evolutions (e.g. Espeon, Golbat -> Crobat): PokeAPI stores today's threshold 160.
[evolution]
generations = [2, 3]
min_happiness = 220
reason = "Friendship threshold was 220 before Gen 8"
