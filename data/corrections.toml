# Friendship evolutions (e.g. Espeon, Golbat -> Crobat): PokeAPI stores today's threshold 160.
[evolution]
generations = [2, 3]
min_happiness = 220
reason = "Friendship threshold was 220 before Gen 8"
source = "pokecrystal constants/pokemon_data_constants.asm (HAPPINESS_TO_EVOLVE); pokefirered src/pokemon.c"

# Event-only Pokémon that PokeAPI lists as encounters. Events do not count as obtainable (REQUIREMENTS R5a).
[[unobtainable]]
games = ["crystal"]
species = "celebi"
reason = "GS Ball: originally a Japan-only mobile event (in-game only in the 3DS Virtual Console release)"
source = "https://bulbapedia.bulbagarden.net/wiki/GS_Ball"

