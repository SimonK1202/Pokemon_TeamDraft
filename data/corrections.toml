# Hand-made corrections, applied by the importer on top of the raw PokeAPI data.
# Only for values where PokeAPI (commit in pokeapi_source.toml) differs from the games or from REQUIREMENTS.md.
#
# Checked 2026-11-12 with tools/verify_against_games.py against the game disassemblies (commits pinned there):
#   pret/pokered       data/moves/moves.asm, data/pokemon/base_stats/*.asm, data/pokemon/evos_moves.asm,
#                      data/types/type_matchups.asm
#   pret/pokecrystal   data/moves/moves.asm, data/types/type_matchups.asm, data/wild/*.asm
#   pret/pokefirered   src/data/battle_moves.h
# Result: Gen 1 base stats, types, type chart and learnsets match exactly; Gen 2 type chart matches;
# the moves below differ because a later change is missing in PokeAPI's move_changelog.csv.

[[move]]
identifier = "rest"
generations = [1, 2, 3]
pp = 10
reason = "PP was 10 before Gen 9; change missing in move_changelog"
source = "pokered, pokecrystal data/moves/moves.asm; pokefirered src/data/battle_moves.h"

